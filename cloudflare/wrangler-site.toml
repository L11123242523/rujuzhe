# Wrangler 配置 —— 静态站反代（把自有域名根域 / www 反代到 GitHub Pages）
# 部署：npx wrangler deploy -c cloudflare/wrangler-site.toml
name = "rujuzhe-site"
main = "site-proxy.mjs"
compatibility_date = "2025-09-01"

# custom_domain = true 由 Cloudflare 自动建 DNS 记录并签发证书。
# 前提：rujuzhe-b-a-gs.top 的 DNS 已托管在同一个 Cloudflare 账号下。
routes = [
  { pattern = "rujuzhe-b-a-gs.top", custom_domain = true },
  { pattern = "www.rujuzhe-b-a-gs.top", custom_domain = true }
]

[observability]
enabled = true
